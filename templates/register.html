<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PALLAS - Create account</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Nunito', sans-serif; }</style>
</head>
<body class="bg-[#fcf5f5] text-gray-800 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-white rounded-[2rem] shadow-[0_8px_30px_rgb(0,0,0,0.04)] p-8" x-data="registerForm()">
        <div class="text-center mb-8">
            <div class="w-24 h-24 mx-auto bg-gradient-to-br from-pink-500 to-rose-500 rounded-full flex items-center justify-center mb-6 shadow-lg shadow-pink-500/30">
                <svg class="w-12 h-12 text-white" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"/></svg>
            </div>
            <h1 class="text-4xl font-extrabold text-gray-900 tracking-tight">PALLAS</h1>
            <p class="text-gray-500 mt-2 font-medium">Start your 14-day training.</p>
        </div>

        <form @submit.prevent="submit" class="space-y-4">
            <div>
                <input x-model="email" type="email" required placeholder="Email address"
                       class="w-full px-5 py-4 rounded-2xl bg-gray-50 border-none focus:ring-2 focus:ring-pink-500 outline-none font-medium placeholder-gray-400">
            </div>
            <div>
                <input x-model="password" type="password" required minlength="6" placeholder="Password (min 6 chars)"
                       class="w-full px-5 py-4 rounded-2xl bg-gray-50 border-none focus:ring-2 focus:ring-pink-500 outline-none font-medium placeholder-gray-400">
            </div>
            <p x-show="error" x-text="error" class="text-red-500 text-sm font-semibold text-center"></p>
            <button type="submit"
                    class="w-full bg-pink-500 hover:bg-pink-600 text-white py-4 rounded-2xl font-bold text-lg transition-colors shadow-lg shadow-pink-500/30">
                Create Account
            </button>
        </form>
        
        <p class="text-center text-sm text-gray-500 mt-6 font-medium">
            Already have an account? <a href="/login" class="text-pink-500 hover:text-pink-600 font-bold">Sign in</a>
        </p>
    </div>
    <script>
        function registerForm() {
            return {
                email: '', password: '', error: '',
                async submit() {
                    this.error = '';
                    const r = await fetch('/register', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({email: this.email, password: this.password})
                    });
                    if (r.ok) window.location.href = '/';
                    else { const d = await r.json().catch(()=>({})); this.error = d.error || 'Registration failed'; }
                }
            };
        }
    </script>
</body>
</html>
